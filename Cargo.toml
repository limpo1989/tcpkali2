[package]
name = "tcpkali2"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "A load testing tool for WebSocket and TCP server."
authors = ["limpo1989 <limpo1989@gmail.com>"]
repository = "https://github.com/limpo1989/tcpkali2"
homepage = "https://github.com/limpo1989/tcpkali2"
keywords = ["networking", "tcp", "websocket"]
categories = ["command-line-utilities", "network-programming"]
license = "Apache-2.0"

[dependencies]
clap = "4.6.6"
futures = "0.3.34"
tokio = { version = "1.53.1", features = ["time", "rt", "rt-multi-thread", "macros", "sync", "signal"] }
tokio-tungstenite = "0.30.0"
tungstenite = "0.30.0"
rand = "0.10.2"
parking_lot = "0.12.5"
hdrhistogram = "7.6.0"
bytes = "1.12.1"
thiserror = "2.0.20"

[profile.release]
lto = "thin"
codegen-units = 1
