[package]
name = "tcpkali2"
version = "0.2.0"
edition = "2024"
description = "A load testing tool for WebSocket and TCP server."
authors = ["limpo1989 <limpo1989@gmail.com>"]
repository = "https://github.com/limpo1989/tcpkali2"
homepage = "https://github.com/limpo1989/tcpkali2"
keywords = ["networking", "tcp", "websocket"]
categories = ["command-line-utilities", "network-programming"]
license = "Apache-2.0"

[dependencies]
clap = "4.5.37"
futures = "0.3.31"
tokio = { version = "1.45.0", features = ["time", "rt", "rt-multi-thread", "macros", "sync", "signal"] }
tokio-tungstenite = "0.28.0"
tungstenite = "0.28.0"
rand = "0.9.1"
parking_lot = "0.12.3"
hdrhistogram = "7.5.4"
crossbeam-queue = "0.3.12"
crossbeam-deque = "0.8.5"
bytes = "1.10.1"
thiserror = "1.0.69"